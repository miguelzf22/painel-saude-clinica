<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Painel Saúde Clínica 3</h1>

    <select name="tipo-de-paciente" id="tipo-de-paciente">
        <option value="particular">Particular</option>
        <option value="convenio">Convenio</option>
    </select>

    <form id="cadastro">
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome" required>
        <br>
        <label for="altura">Altura</label>
        <input type="number" step="0.01" nome="altura" id="altura" required>
        <br>
        <label for="peso">Peso</label>
        <input type="number" step="0.01" nome="peso" id="peso" required>
        <br>
        <label for="cep">Cep</label>
        <input type="text" nome="cep" id="cep" required>
        <br>
        <label for="carteirinha">Carteirinha</label>
        <input type="hidden" nome="carteirinha" id="carteirinha">
        <br>
        <button type="submit">Enviar</button>
    </form>

    <script>
        const tipoDePaciente = document.getElementById('tipo-de-paciente')
        const checkPaciente = ()=>{
            if (tipoDePaciente.value === 'convenio') {
                document.getElementById('carteirinha').type = "text";
            }
            else { document.getElementById('carteirinha').type = "hidden"; }
        }
        
        tipoDePaciente.addEventListener('change', checkPaciente)

        checkPaciente()
    </script>

    <script src="app.js" type="module"></script>
</body>

</html>
